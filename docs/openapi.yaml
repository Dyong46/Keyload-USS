  /appointments/{id}/cancel:
    post:
      operationId: cancelAppointment
      summary: Cancel an uncompleted appointment
      tags:
        - Appointments
      description: CONFIRMED can be cancelled before or after scheduled start/end. Keep the record and
        cancellation time; release only remaining occupancy. Already CANCELLED returns the same
        record unchanged. COMPLETED returns 409 INVALID_APPOINTMENT_STATE. No request body is
        accepted; server supplies time. Mutation is transactional and coordinated with
        booking/completion.
      parameters:
        - name: id
          in: path
          required: true
          description: Record identifier.
          schema:
            $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: Cancelled appointment, or unchanged record for a repeat cancellation.
          headers:
            X-Request-Id:
              description: Server-generated correlation ID returned on every response.
              schema:
                $ref: "#/components/schemas/Uuid"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Appointment"
              examples:
                cancelled:
                  summary: Cancelled record
                  value:
