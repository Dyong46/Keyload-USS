  /appointments/{id}/complete:
    post:
      operationId: completeAppointment
      summary: Complete service and release remaining resources
      tags:
        - Appointments
      description: Only CONFIRMED at or after scheduled start may complete. Reject earlier completion or
        CANCELLED state with 409 INVALID_APPOINTMENT_STATE. Repeated completion is 409
        APPOINTMENT_ALREADY_COMPLETED and preserves original completion time. Record server actual
        completion time, preserve scheduled start/end, and release the remainder; late completion
        never extends occupancy past scheduled end. No Start action or request body. Scheduled end
        releases resources even without this operation, but does not automatically set COMPLETED.
      parameters:
        - name: id
          in: path
          required: true
          description: Record identifier.
          schema:
            $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: Completed appointment.
          headers:
            X-Request-Id:
              description: Server-generated correlation ID returned on every response.
              schema:
