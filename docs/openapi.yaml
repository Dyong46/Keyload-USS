                    serviceBay:
                      id: 00000008-0000-4000-8000-000000000008
                      label: Bay A
                      dealershipId: 00000003-0000-4000-8000-000000000003
                    scheduledStart: 2026-11-02T02:00:00Z
                    scheduledEnd: 2026-11-02T03:30:00Z
