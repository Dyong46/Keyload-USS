components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
        - database
        - timestamp
        - demoStaff
      properties:
        status:
          type: string
          enum: [ok]
        database:
          type: string
          enum: [up]
        timestamp:
          $ref: "#/components/schemas/Timestamp"
        demoStaff:
          type: object
          additionalProperties: false
          required:
            - id
            - displayName
          properties:
            id:
              $ref: "#/components/schemas/Uuid"
            displayName:
              type: string
              minLength: 1
    Uuid:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
      description: ISO 8601 instant with Z or an explicit offset. Responses use UTC Z; displayed business
        time is Asia/Ho_Chi_Minh.
    BusinessDate:
      type: string
      format: date
      pattern: ^\d{4}-\d{2}-\d{2}$
      description: Calendar date in Asia/Ho_Chi_Minh.
    AppointmentStatus:
      type: string
      enum:
        - CONFIRMED
        - CANCELLED
        - COMPLETED
    Customer:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - phone
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          minLength: 1
        phone:
          type: string
          pattern: '^\+[1-9]\d{7,14}$'
    CreateCustomerRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - phone
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          type: string
          description: Vietnamese local or international phone input; stored normalized.
    UpdateCustomerRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          type: string
          description: Vietnamese local or international phone input; stored normalized.
    CreateVehicleRequest:
      type: object
      additionalProperties: false
      required:
        - registrationNumber
        - make
        - model
      properties:
        registrationNumber:
          type: string
          minLength: 3
          maxLength: 20
        make:
          type: string
          minLength: 1
          maxLength: 50
        model:
          type: string
          minLength: 1
          maxLength: 50
    Vehicle:
      type: object
      additionalProperties: false
      required:
        - id
        - customerId
        - registrationNumber
        - make
        - model
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        customerId:
          $ref: "#/components/schemas/Uuid"
        registrationNumber:
          type: string
          minLength: 1
        make:
          type: string
          minLength: 1
        model:
          type: string
          minLength: 1
    Dealership:
      type: object
      additionalProperties: false
      required:
        - id
        - name
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          minLength: 1
    ServiceType:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - durationMinutes
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          minLength: 1
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 540
    CreateServiceTypeRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - durationMinutes
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 540
    UpdateServiceTypeRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 540
    Technician:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - dealershipId
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          minLength: 1
        dealershipId:
          $ref: "#/components/schemas/Uuid"
    TechnicianManagement:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - dealership
        - serviceTypes
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          minLength: 1
        dealership:
          $ref: "#/components/schemas/Dealership"
        serviceTypes:
          type: array
          items:
            $ref: "#/components/schemas/ServiceType"
    UpdateTechnicianRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    CreateTechnicianRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - dealershipId
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        dealershipId:
          $ref: "#/components/schemas/Uuid"
        serviceTypeIds:
          type: array
          uniqueItems: true
          maxItems: 100
          default: []
          items:
            $ref: "#/components/schemas/Uuid"
    ServiceBay:
      type: object
      additionalProperties: false
      required:
        - id
        - label
        - dealershipId
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        label:
          type: string
          minLength: 1
        dealershipId:
          $ref: "#/components/schemas/Uuid"
    AppointmentService:
      type: object
      additionalProperties: false
      required:
        - serviceTypeId
        - name
        - durationMinutes
      properties:
        serviceTypeId:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
          minLength: 1
        durationMinutes:
          type: integer
          minimum: 1
      description: Snapshot of a booked service, retained independently of later reference-data changes.
    CreateAppointmentRequest:
      type: object
      additionalProperties: false
      required:
        - customerId
        - vehicleId
        - dealershipId
        - serviceIds
        - scheduledStart
        - technicianId
        - serviceBayId
      properties:
        customerId:
          $ref: "#/components/schemas/Uuid"
        vehicleId:
          $ref: "#/components/schemas/Uuid"
        dealershipId:
          $ref: "#/components/schemas/Uuid"
        serviceIds:
          type: array
          items:
            $ref: "#/components/schemas/Uuid"
          minItems: 1
          uniqueItems: true
          description: Unordered set of distinct service types. One technician must support all selected
            services. Total duration is their sum.
        scheduledStart:
          $ref: "#/components/schemas/Timestamp"
        technicianId:
          $ref: "#/components/schemas/Uuid"
        serviceBayId:
          $ref: "#/components/schemas/Uuid"
      description: Confirm immediately if valid. The client cannot supply duration, end time, status, or
        actual lifecycle timestamps. Services run sequentially using the same technician and bay.
    AvailabilitySlot:
      type: object
      additionalProperties: false
      required:
        - scheduledStart
        - scheduledEnd
        - technicians
        - serviceBays
        - suggestedTechnicianId
        - suggestedServiceBayId
      properties:
        scheduledStart:
          $ref: "#/components/schemas/Timestamp"
        scheduledEnd:
          $ref: "#/components/schemas/Timestamp"
        technicians:
          type: array
          items:
            $ref: "#/components/schemas/Technician"
          minItems: 1
          description: Technicians qualified for all selected services and free for the full interval;
            ascending ID.
        serviceBays:
          type: array
          items:
            $ref: "#/components/schemas/ServiceBay"
          minItems: 1
          description: Available for the full interval; ascending ID. Every bay supports every service.
        suggestedTechnicianId:
          $ref: "#/components/schemas/Uuid"
        suggestedServiceBayId:
          $ref: "#/components/schemas/Uuid"
      description: Every resource belongs to the selected dealership. Suggested IDs are the first entries
        in their respective sorted arrays; staff can select alternatives.
    AvailabilityResponse:
      type: object
      additionalProperties: false
      required:
        - dealershipId
        - vehicleId
        - date
        - timeZone
        - generatedAt
        - services
        - totalDurationMinutes
        - slots
      properties:
        dealershipId:
          $ref: "#/components/schemas/Uuid"
        vehicleId:
          $ref: "#/components/schemas/Uuid"
        date:
          $ref: "#/components/schemas/BusinessDate"
        timeZone:
          type: string
          enum:
            - Asia/Ho_Chi_Minh
        generatedAt:
          $ref: "#/components/schemas/Timestamp"
        services:
          type: array
          items:
            $ref: "#/components/schemas/ServiceType"
          minItems: 1
        totalDurationMinutes:
          type: integer
          minimum: 1
        slots:
          type: array
          items:
            $ref: "#/components/schemas/AvailabilitySlot"
      description: Snapshot, never a reservation. Empty slots is a successful no-capacity response. New
        lookup excludes past starts; all intervals must fit 08:00–17:00 and start on a 30-minute
        boundary.
    ErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - RESOURCE_NOT_FOUND
        - INVALID_RELATIONSHIP
        - TECHNICIAN_NOT_QUALIFIED
        - INVALID_SCHEDULE
        - RESOURCE_CONFLICT
        - VEHICLE_CONFLICT
        - CONFIRMATION_TOO_LATE
        - IDEMPOTENCY_KEY_REUSED
        - INVALID_APPOINTMENT_STATE
        - APPOINTMENT_ALREADY_COMPLETED
        - SERVICE_UNAVAILABLE
        - INTERNAL_ERROR
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - statusCode
        - code
        - message
        - requestId
      properties:
        statusCode:
          type: integer
          minimum: 400
          maximum: 599
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          oneOf:
            - type: string
              minLength: 1
            - type: array
              items:
                type: string
                minLength: 1
              minItems: 1
        requestId:
          $ref: "#/components/schemas/Uuid"
      description: Stable machine code plus safe readable message. Never includes credentials, SQL, or
        stack traces.
    Appointment:
      type: object
      additionalProperties: false
      required:
        - id
        - customer
        - vehicle
        - dealership
        - services
        - totalDurationMinutes
        - technician
        - serviceBay
        - scheduledStart
        - scheduledEnd
        - status
        - createdAt
        - updatedAt
        - cancelledAt
        - actualCompletedAt
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        customer:
          $ref: "#/components/schemas/Customer"
        vehicle:
          $ref: "#/components/schemas/Vehicle"
        dealership:
          $ref: "#/components/schemas/Dealership"
        services:
          type: array
          items:
            $ref: "#/components/schemas/AppointmentService"
          minItems: 1
        totalDurationMinutes:
          type: integer
          minimum: 1
        technician:
          $ref: "#/components/schemas/Technician"
        serviceBay:
          $ref: "#/components/schemas/ServiceBay"
        scheduledStart:
          $ref: "#/components/schemas/Timestamp"
        scheduledEnd:
          $ref: "#/components/schemas/Timestamp"
        status:
          $ref: "#/components/schemas/AppointmentStatus"
        createdAt:
          $ref: "#/components/schemas/Timestamp"
        updatedAt:
          $ref: "#/components/schemas/Timestamp"
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        actualCompletedAt:
          type: string
          format: date-time
          nullable: true
      description: Explicit public DTO. CONFIRMED has null lifecycle timestamps; CANCELLED has cancelledAt
        only; COMPLETED has actualCompletedAt only. The original scheduled interval remains
        unchanged. Passing scheduled end releases resources without automatically changing status.
        Internal request keys/hashes and occupancy fields are not exposed.
    AppointmentListResponse:
      type: object
      additionalProperties: false
      required:
        - items
        - page
        - pageSize
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Appointment"
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
      description: Filtering and case-insensitive partial search precede ordering/pagination. Order is
        scheduledStart ascending, then id ascending. total is the full matching count, not the page
        length. A valid page beyond the final page returns empty items.
  responses:
    BadRequest:
      description: Malformed DTO, invalid schedule, relationship, or qualification.
      headers:
        X-Request-Id:
          description: Server-generated correlation ID returned on every response.
          schema:
            $ref: "#/components/schemas/Uuid"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            validation:
              summary: Invalid input
              value:
                statusCode: 400
                code: VALIDATION_ERROR
                message:
                  - serviceIds must contain at least one service
                requestId: 00000011-0000-4000-8000-000000000011
            relationship:
              summary: Ownership mismatch
              value:
                statusCode: 400
                code: INVALID_RELATIONSHIP
                message: Vehicle does not belong to the selected customer
                requestId: 00000011-0000-4000-8000-000000000011
            qualification:
              summary: Not qualified for all services
              value:
                statusCode: 400
                code: TECHNICIAN_NOT_QUALIFIED
                message: Technician must support every selected service
                requestId: 00000011-0000-4000-8000-000000000011
            schedule:
              summary: Invalid schedule
              value:
                statusCode: 400
                code: INVALID_SCHEDULE
                message: The combined service duration must end by 17:00
                requestId: 00000011-0000-4000-8000-000000000011
    NotFound:
      description: A referenced customer, vehicle, dealership, service, resource, or appointment does not exist.
      headers:
        X-Request-Id:
          description: Server-generated correlation ID returned on every response.
          schema:
            $ref: "#/components/schemas/Uuid"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            missing:
              summary: Missing record
              value:
                statusCode: 404
                code: RESOURCE_NOT_FOUND
                message: Requested resource was not found
                requestId: 00000011-0000-4000-8000-000000000011
    Conflict:
      description: Current state conflicts with the requested operation. Codes identify the recovery action.
      headers:
        X-Request-Id:
          description: Server-generated correlation ID returned on every response.
          schema:
            $ref: "#/components/schemas/Uuid"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            resource:
              summary: Refresh availability; no silent substitution
              value:
                statusCode: 409
                code: RESOURCE_CONFLICT
                message: Selected technician or service bay is no longer available
                requestId: 00000011-0000-4000-8000-000000000011
            vehicle:
              summary: Vehicle conflicts across dealerships
              value:
                statusCode: 409
                code: VEHICLE_CONFLICT
                message: Vehicle has an overlapping appointment
                requestId: 00000011-0000-4000-8000-000000000011
            tooLate:
              summary: Choose a new start
              value:
                statusCode: 409
                code: CONFIRMATION_TOO_LATE
                message: The selected start is more than 15 minutes in the past
                requestId: 00000011-0000-4000-8000-000000000011
            keyMismatch:
              summary: Use a new key for a new operation
              value:
                statusCode: 409
                code: IDEMPOTENCY_KEY_REUSED
                message: This request key was already used with different booking content
                requestId: 00000011-0000-4000-8000-000000000011
            invalidState:
              summary: Invalid transition or completion before start
              value:
                statusCode: 409
                code: INVALID_APPOINTMENT_STATE
                message: This operation is not allowed for the appointment state
                requestId: 00000011-0000-4000-8000-000000000011
            alreadyCompleted:
              summary: Completion cannot be repeated
              value:
                statusCode: 409
                code: APPOINTMENT_ALREADY_COMPLETED
                message: Appointment already completed
                requestId: 00000011-0000-4000-8000-000000000011
    ServiceUnavailable:
      description: Database unavailable or bounded contention handling exhausted. A booking retry must
        reuse the same request key.
      headers:
        X-Request-Id:
          description: Server-generated correlation ID returned on every response.
          schema:
            $ref: "#/components/schemas/Uuid"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            unavailable:
              summary: Transient failure
              value:
                statusCode: 503
                code: SERVICE_UNAVAILABLE
                message: Service temporarily unavailable; retry with the same booking request key
                requestId: 00000011-0000-4000-8000-000000000011
    InternalError:
      description: Unexpected safe error response. A failed operation must not leave partial records.
      headers:
        X-Request-Id:
          description: Server-generated correlation ID returned on every response.
          schema:
            $ref: "#/components/schemas/Uuid"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            unexpected:
              summary: Use requestId for investigation
              value:
                statusCode: 500
                code: INTERNAL_ERROR
                message: Unexpected server error
                requestId: 00000011-0000-4000-8000-000000000011
